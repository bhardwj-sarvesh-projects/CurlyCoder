description = "Quick reference for CODELEAN levels, skills, and commands"
prompt = "Show the CODELEAN quick reference. One shot, change nothing: do not switch mode, write flag files, or persist anything. Levels: /CODELEAN lite (build what's asked, name the lazier alternative in one line), /CODELEAN (full, the default ladder: YAGNI then stdlib then native then one line then minimum), /CODELEAN ultra (deletion before addition, challenges the requirement before building). Commands: /CODELEAN-review (over-engineering review of the current changes), /CODELEAN-audit (whole-repo over-engineering audit), /CODELEAN-debt (harvest CODELEAN: comments into a tracked ledger), /CODELEAN-gain (measured-impact scoreboard from the benchmark), /CODELEAN-help (this card). Deactivate with 'stop CODELEAN', 'normal mode', or /CODELEAN off; resume anytime with /CODELEAN. Default mode is full; change it with the CODELEAN_DEFAULT_MODE environment variable (off|lite|full|ultra) or a config file at ~/.config/CODELEAN/config.json (Windows: %APPDATA%\\CODELEAN\\config.json) with {\"defaultMode\": \"lite\"}. Resolution order: env var, then config file, then full."
